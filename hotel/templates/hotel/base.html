<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Hotel Ríos del Sur{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'inicio' %}">Hotel Ríos del Sur</a>
      {% if user.is_authenticated %}
      <div class="navbar-nav flex-row gap-3 me-auto ms-4">
        <a class="nav-link" href="{% url 'tablero' %}">Tablero</a>
        <a class="nav-link" href="{% url 'disponibilidad' %}">Disponibilidad</a>
        <a class="nav-link" href="{% url 'reserva_lista' %}">Reservas</a>
        <a class="nav-link" href="{% url 'habitacion_lista' %}">Habitaciones</a>
        <a class="nav-link" href="{% url 'huesped_lista' %}">Huéspedes</a>
      </div>
      <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-2 mb-0">
        {% csrf_token %}
        <span class="navbar-text">{{ user.get_username }}</span>
        <button type="submit" class="btn btn-sm btn-outline-light">Salir</button>
      </form>
      {% endif %}
    </div>
  </nav>

  <main class="container">
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">
        {{ message }}
      </div>
    {% endfor %}

    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
